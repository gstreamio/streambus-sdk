name: Release Please

on:
  push:
    branches:
      - main
  # Lets a release be re-driven by hand when a run fails for a reason that
  # has since been fixed, without needing an empty commit to main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT is preferred, as it is in the core repository: a release PR
          # opened with the default GITHUB_TOKEN does not trigger `on:
          # pull_request` workflows, so CI stays unreported on it. Falls back
          # to GITHUB_TOKEN so releases still cut before that secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
